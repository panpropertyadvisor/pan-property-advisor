name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode and install certificate
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A
          security list-keychains -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod repo update

      - name: Flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: Build signed IPA
        run: |
          flutter build ipa --release --export-options-plist=ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/app-store-connect-upload@v1
        with:
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          app-path: build/ios/ipa/*.ipa
