name: iOS Build & TestFlight Upload

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SET UP FLUTTER
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # ============================================================
      # 3. SHOW FLUTTER VERSION
      # ============================================================

      - name: Flutter version
        run: |
          flutter --version
          dart --version


      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          flutter pub get


      # ============================================================
      # 5. INSTALL APPLE CERTIFICATE AND PROFILE
      # ============================================================

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "=========================================="
          echo "DECODING APPLE SIGNING FILES"
          echo "=========================================="

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          echo "Certificate:"
          ls -lh "$CERTIFICATE_PATH"

          echo "Provisioning profile:"
          ls -lh "$PP_PATH"


          # --------------------------------------------------------
          # CREATE KEYCHAIN
          # --------------------------------------------------------

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"


          # --------------------------------------------------------
          # IMPORT CERTIFICATE
          # --------------------------------------------------------

          echo "Importing Apple Distribution certificate..."

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A


          # --------------------------------------------------------
          # ALLOW CODESIGN
          # --------------------------------------------------------

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"


          # --------------------------------------------------------
          # SET KEYCHAIN
          # --------------------------------------------------------

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"


          # --------------------------------------------------------
          # VERIFY CERTIFICATE
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "AVAILABLE CODE SIGNING IDENTITIES"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"


          # --------------------------------------------------------
          # INSTALL PROVISIONING PROFILE
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "INSTALLING PROVISIONING PROFILE"
          echo "=========================================="

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"


          # --------------------------------------------------------
          # PROFILE INFORMATION
          # --------------------------------------------------------

          security cms \
            -D \
            -i "$PP_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          echo ""
          echo "=========================================="
          echo "PROVISIONING PROFILE INFORMATION"
          echo "=========================================="

          echo "Profile Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "Profile UUID:"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          echo "Application Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo "Team Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier" \
            "$RUNNER_TEMP/profile.plist"


      # ============================================================
      # 6. CONFIGURE XCODE PROJECT FOR CI SIGNING
      # ============================================================

      - name: Configure iOS signing
        run: |

          echo "=========================================="
          echo "CONFIGURING IOS SIGNING"
          echo "=========================================="

          echo "Bundle ID: com.panpropertyadvisor.app"
          echo "Team ID: 3C9698764Z"
          echo "Certificate: Apple Distribution"
          echo "Provisioning Profile: AppStore_Profile"


          # Set the development team
          sed -i '' \
            's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = 3C9698764Z;/g' \
            ios/Runner.xcodeproj/project.pbxproj


          # Set manual signing
          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            ios/Runner.xcodeproj/project.pbxproj


          # Set distribution certificate
          sed -i '' \
            's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            ios/Runner.xcodeproj/project.pbxproj


          # Add provisioning profile name
          sed -i '' \
            '/CODE_SIGN_IDENTITY = "Apple Distribution";/a\
                PROVISIONING_PROFILE_SPECIFIER = "AppStore_Profile";' \
            ios/Runner.xcodeproj/project.pbxproj


          echo ""
          echo "=========================================="
          echo "XCODE SIGNING SETTINGS"
          echo "=========================================="

          grep -n \
            -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj \
            || true


      # ============================================================
      # 7. CREATE EXPORT OPTIONS
      # ============================================================

      - name: Create ExportOptions.plist
        run: |

          cat > ExportOptions.plist <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>3C9698764Z</string>

              <key>destination</key>
              <string>export</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.panpropertyadvisor.app</key>
                  <string>AppStore_Profile</string>
              </dict>

              <key>uploadBitcode</key>
              <false/>

              <key>compileBitcode</key>
              <false/>

          </dict>

          </plist>

          EOF


          echo ""
          echo "=========================================="
          echo "EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat ExportOptions.plist


      # ============================================================
      # 8. BUILD IPA
      # ============================================================

      - name: Build IPA
        run: |

          echo "=========================================="
          echo "BUILDING IOS IPA"
          echo "=========================================="

          flutter clean

          flutter pub get

          flutter build ipa \
            --release \
            --export-options-plist=ExportOptions.plist


      # ============================================================
      # 9. CHECK IPA
      # ============================================================

      - name: Check generated IPA
        run: |

          echo "=========================================="
          echo "GENERATED IPA"
          echo "=========================================="

          ls -lah build/ios/ipa/


      # ============================================================
      # 10. UPLOAD TO TESTFLIGHT
      # ============================================================

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v4
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}


      # ============================================================
      # 11. SAVE IPA ARTIFACT
      # ============================================================

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa/*.ipa
